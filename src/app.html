/* Font styles */
:root, :root[data-font="bold"]{--display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif; --display-weight:800; --display-track:-.02em; --body:"Figtree", -apple-system, system-ui, sans-serif; --radius:18px; --radius-sm:12px; --btn-radius:14px; --base:16px}
:root[data-font="rounded"]{--display:"Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif; --display-weight:600; --display-track:0; --body:"Nunito", -apple-system, system-ui, sans-serif; --radius:24px; --radius-sm:16px; --btn-radius:999px; --base:16px}
:root[data-font="classic"]{--display:"Gloock", Georgia, serif; --display-weight:400; --display-track:0; --body:"Instrument Sans", -apple-system, system-ui, sans-serif; --radius:14px; --radius-sm:10px; --btn-radius:10px; --base:16px}
:root[data-font="easy"]{--display:"Lexend", -apple-system, system-ui, sans-serif; --display-weight:700; --display-track:-.015em; --body:"Lexend", -apple-system, system-ui, sans-serif; --radius:16px; --radius-sm:12px; --btn-radius:12px; --base:17px}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--base,16px);line-height:1.5;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(100px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:var(--display-weight);letter-spacing:var(--display-track);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent-ink)}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{font-size:clamp(2rem,9vw,2.6rem);line-height:1}
.eyebrow{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink)}
.count{font-size:.85rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.88rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--edge);background:var(--card);border-radius:var(--btn-radius);padding:10px 16px;font-weight:700;font-size:.95rem;min-height:44px}
.btn svg{width:18px;height:18px;flex:none}
a.btn{text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.block{width:100%}
.btn.big{min-height:58px;font-size:1.12rem;font-weight:800;border-radius:var(--radius)}
.btn:disabled{opacity:.55}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--edge);background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}

.search{width:100%;border:1.5px solid var(--edge);background:var(--card);border-radius:var(--btn-radius);padding:12px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none;margin-inline:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--edge);background:var(--card);border-radius:999px;padding:7px 14px;font-size:.9rem;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* recipe grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;margin-top:14px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;display:block;text-align:left;background:none;border:0;padding:0;color:inherit;min-width:0}
.tile-img{position:relative;isolation:isolate;aspect-ratio:1/1;max-width:100%;border-radius:var(--radius);overflow:hidden;background:var(--accent-soft);display:grid;place-items:center}
.tile-img img{width:100%;height:100%;object-fit:cover;display:block}
.tile-img .ini{font-family:var(--display);font-weight:var(--display-weight);font-size:3.2rem;color:var(--accent-ink);line-height:1}
.tile.alt .tile-img{background:var(--pop-soft)}
.tile.alt .tile-img .ini{color:var(--ink)}
.tile .t{font-family:var(--display);font-weight:var(--display-weight);letter-spacing:var(--display-track);font-size:1.05rem;line-height:1.2;margin-top:8px;overflow-wrap:anywhere}
.tile .meta{font-size:.8rem;color:var(--muted);margin-top:2px;font-weight:600}
.star{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--card);color:var(--edge);font-size:1.15rem;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow)}
.star.on{color:var(--pop-ink)}

.empty{background:var(--card);border-radius:var(--radius);padding:28px 20px;text-align:center;color:var(--muted);box-shadow:var(--shadow);border:1.5px solid var(--line)}
.empty h2{color:var(--ink);font-size:1.4rem;margin-bottom:6px}
.empty p{margin:0 auto 14px;max-width:40ch}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.card-body{padding:18px 18px 22px}
.back-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}

/* recipe page */
.r-hero{position:relative;margin:-18px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;}
.r-hero img{width:100%;aspect-ratio:4/3;max-height:420px;object-fit:cover;display:block;background:var(--accent-soft)}
.r-hero .bar{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px}
.r-bar{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.r-head{padding-top:16px}
.r-head h2{font-size:clamp(1.8rem,8vw,2.4rem);line-height:1.05;margin:6px 0 14px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:10px 8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:var(--display-weight);font-size:1.15rem;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.start{margin-top:16px}
.actions-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.inline-panel{margin-top:10px;background:var(--accent-soft);border-radius:var(--radius-sm);padding:12px;display:grid;gap:10px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sec-h h3{font-size:1.35rem}
.scaler{display:inline-flex;align-items:center;gap:2px;font-size:.88rem;font-weight:700;background:var(--card);border:1.5px solid var(--edge);border-radius:999px;padding:3px}
.scaler button{border:0;background:var(--accent-soft);color:var(--accent-ink);border-radius:50%;width:32px;height:32px;font-size:1.15rem;line-height:1;font-weight:800}
.scaler span{min-width:5.8em;text-align:center;font-variant-numeric:tabular-nums}
.ing{list-style:none;margin:0;padding:4px 0;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius)}
.ing li{display:flex;align-items:center;padding:0 14px}
.ing li + li label{border-top:1px solid var(--line)}
.ing li.selrow{gap:12px;padding:11px 14px;cursor:pointer}
.ing li.selrow + li.selrow{border-top:1px solid var(--line)}
.ing li.selrow.on{background:var(--accent-soft)}
.ing label{display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;padding:11px 0}
.check{appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--accent-ink);flex:none;margin:0;display:grid;place-items:center;background:var(--card);cursor:pointer}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:7px;height:13px;border:solid var(--on-accent);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.check:checked + span{text-decoration:line-through;color:var(--muted)}
.ing .head{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink);padding:14px 0 4px}
.scaled{color:var(--accent-ink);font-weight:800}

.ubar-h{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.ubar-h span{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.ubar-t{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.ubar-t i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.ubar.warn .ubar-t i{background:#e0a100}
.ubar.bad .ubar-t i{background:var(--danger)}
.uhist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.85rem;font-variant-numeric:tabular-nums}
.uhist li{display:grid;grid-template-columns:3.5em 1fr auto;gap:10px;color:var(--muted)}
.adbar.off{display:none}
.adbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 61px);z-index:18;height:50px;background:var(--card);border-top:1.5px solid var(--line);overflow:hidden;display:flex;justify-content:center}
body.has-ad .fab{bottom:calc(env(safe-area-inset-bottom,0px) + 126px)}
body.has-ad .wrap{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.has-ad .selbar{bottom:calc(env(safe-area-inset-bottom,0px) + 112px)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1.5px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{border:0;background:none;padding:9px 0 8px;display:grid;justify-items:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted)}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent-ink)}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:19;padding:14px 22px;box-shadow:0 8px 22px rgba(0,0,0,.22);font-size:1rem;font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:.92rem;font-weight:700;max-width:calc(100% - 32px);text-align:center}

/* auth */
.auth{max-width:420px;margin:6vh auto 0}
.auth .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--accent-soft);border-radius:var(--btn-radius);padding:4px;margin-bottom:14px}
.auth .seg button{border:0;background:none;border-radius:var(--btn-radius);padding:9px;font-weight:800;color:var(--muted)}
.auth .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- cooking mode ---------- */
.cook{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cook-top{padding:10px max(16px,env(safe-area-inset-left,0px)) 6px max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}
.cook-top .row{display:flex;align-items:center;gap:10px}
.cook-top .ttl{flex:1;min-width:0;font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--edge)}
.prog i.on{background:var(--accent)}
.timers{display:flex;gap:8px;flex-wrap:wrap}
.tpill{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:6px 6px 6px 14px;background:var(--ink);color:var(--bg);font-weight:800;font-size:.92rem;max-width:100%}
.tpill .tnm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tpill .tclk{font-variant-numeric:tabular-nums;opacity:.75}
.tpill .xx{min-width:26px;height:26px;padding:0 6px;border-radius:999px;background:rgba(127,127,127,.35);display:grid;place-items:center;font-size:.8rem;line-height:1}
.tpill.done .xx{background:#1a1200;color:var(--pop)}
.ftimers{position:fixed;z-index:45;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));justify-content:center;pointer-events:none}
.ftimers .tpill{pointer-events:auto;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.tbtn .tname{display:block;font-size:.82rem;font-weight:700;opacity:.8}
.tbtn{text-align:left}
.tpill.done{background:var(--pop);color:#1a1200;animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 6px color-mix(in srgb, var(--pop) 35%, transparent)}}
.cook-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px max(20px,env(safe-area-inset-left,0px)) 20px max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

.cook-step-n span{font-weight:800;color:var(--muted);font-size:.95rem}
.cook-sec{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink)}
.cook-text{font-size:clamp(1.4rem,6.2vw,2rem);line-height:1.38;font-weight:600;letter-spacing:-.005em;margin:0;overflow-wrap:anywhere}
.cook-text mark{background:var(--pop-soft);color:inherit;border-radius:6px;padding:0 .15em}
.cook-ings{display:grid;gap:8px}
.cook-ings h4,.cook-h{margin:0;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.cook-ing{display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font-size:1.05rem}
.cook-ing::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.tbtn{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;border:2px solid var(--accent-ink);background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--btn-radius);padding:12px 18px;font-weight:800;font-size:1.05rem}
.tbtn svg{width:22px;height:22px}
.cook-gather h2{font-size:clamp(1.8rem,8vw,2.4rem);line-height:1.05}
.cook-done{flex:1;display:grid;place-content:center;text-align:center;gap:14px;padding:20px}
.cook-done .big{font-size:4rem;line-height:1}
.cook-done h2{font-size:2.2rem}
.cook-bottom{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-right,0px));border-top:1.5px solid var(--line);background:var(--bg)}
.cook-bottom .btn{min-height:60px;font-size:1.1rem;border-radius:var(--radius)}
.swipe-hint{text-align:center;font-size:.8rem;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}.tpill.done{animation:none}}
@media (prefers-reduced-motion:no-preference){.cook-inner.enter{animation:slidein .22s ease-out}@keyframes slidein{from{opacity:.0;transform:translateX(18px)}}.cook-inner.enter.back{animation-name:slideback}@keyframes slideback{from{opacity:0;transform:translateX(-18px)}}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="splash"><img src="/icon-180.png" alt="" width="84" height="84"><b>Recipe Box</b></div></div>
<div class="adbar" id="adbar" hidden aria-label="Advertisement"></div>
<button class="btn primary fab" id="fab" hidden>+ Add recipe</button>
<nav class="tabs" id="tabs" hidden aria-label="Sections">
  <button data-tab="recipes"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>Recipes</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="grocery"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.5a2 2 0 0 0 2 1.5h7.6a2 2 0 0 0 2-1.5L20.5 8H6"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>Groceries</button>
  <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
</nav>
<div class="toast" id="toast" hidden role="status"></div>

<script>
"use strict";
const CATS = ["Breakfast","Mains","Sides","Soups","Salads","Baking","Desserts","Drinks","Snacks","Other"];
const S = {
  me: null, people: {}, ai: false,
  recipes: [], grocery: [], plan: [],
  tab: "recipes", view: "list", id: null, draft: null,
  q: "", cat: "All", favOnly: false,
  scale: 1, servings: null, planPick: false, confirmDel: false, pendingPhoto: null, removePhoto: false,
  weekStart: mondayOf(new Date()), addingDay: null,
  stores: [], gStore: "All", gPick: null, gEdit: false, gSel: null, gRmConfirm: false,
  imp: { url: "", text: "", busy: "", msg: "", err: false, source_url: "" },
  authMode: "login", authMsg: ""
};
let INVITE = null, START = null;
try { const q = new URLSearchParams(location.search); INVITE = q.get("invite"); START = q.get("start"); } catch {}
if (INVITE || START) S.authMode = "signup";
const app = document.getElementById("app"), fab = document.getElementById("fab"), tabs = document.getElementById("tabs");

/* ---------- banner ad (only when AdSense is set up) ---------- */
let adsLoaded = false;
function setupAds(){
  const box = document.getElementById("adbar");
  if (!S.ads) { box.hidden = true; document.body.classList.remove("has-ad"); return; }
  if (!adsLoaded) {
    adsLoaded = true;
    const sc = document.createElement("script"); sc.async = true; sc.crossOrigin = "anonymous";
    sc.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + encodeURIComponent(S.ads.client);
    document.head.appendChild(sc);
    box.innerHTML = `<ins class="adsbygoogle" style="display:block;width:100%;height:50px" data-ad-client="${esc(S.ads.client)}" data-ad-slot="${esc(S.ads.slot)}" data-full-width-responsive="false"></ins>`;
    try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch {}
  }
  box.hidden = false; document.body.classList.add("has-ad");
}

/* ---------- free plan usage (owner only) ---------- */
const fmtN = n => n >= 1e9 ? (n / 1e9).toFixed(2) + " GB" : n >= 1e6 ? (n / 1e6).toFixed(1) + " MB" : n >= 1e3 ? Math.round(n / 1e3) + " KB" : String(n);
function usageSummary(){
  const u = S.usage; if (!u) return "Today's use of Cloudflare's free limits";
  const worst = Math.max(u.pct.requests, u.pct.neurons, u.pct.dbsize);
  return worst >= .7 ? "⚠ " + Math.round(worst * 100) + "% of a free limit used" : "All well under the free limits";
}
function usageHtml(){
  const u = S.usage;
  if (!u) return `<p class="small muted" style="margin:0"><span class="spinner"></span> Loading…</p>`;
  const bar = (label, val, max, pct, note) => `<div class="ubar ${pct >= .9 ? "bad" : pct >= .7 ? "warn" : ""}"><div class="ubar-h"><b>${label}</b><span>${note}</span></div><div class="ubar-t"><i style="width:${Math.min(100, Math.max(1.5, pct * 100)).toFixed(1)}%"></i></div></div>`;
  const days = (S.usageWeek && S.usageWeek.days) || [];
  const byDay = {}; days.forEach(r => { (byDay[r.day] ||= {})[r.key] = r.n; });
  const hist = Object.keys(byDay).sort().slice(-7).map(d => `<li><span>${new Date(d + "T12:00Z").toLocaleDateString(undefined, { weekday: "short" })}</span><span>${Math.round(byDay[d].requests || 0).toLocaleString()} requests</span><span>${Math.round(byDay[d].ai_calls || 0)} AI ${Math.round(byDay[d].ai_calls || 0) === 1 ? "read" : "reads"}</span></li>`).join("");
  return `<p class="small muted" style="margin:0">Today so far. The request and AI limits reset every day at ${new Date(Date.UTC(2026, 0, 1)).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })} your time.</p>
    ${bar("Server requests", u.requests, 100000, u.pct.requests, `${u.requests.toLocaleString()} of 100,000`)}
    ${bar("AI recipe reading", u.neurons, 10000, u.pct.neurons, `${Math.round(u.pct.neurons * 100)}% · ${u.imports} ${u.imports === 1 ? "read" : "reads"}`)}
    ${bar("Storage", u.dbsize, 5e9, u.pct.dbsize, `${fmtN(u.dbsize)} of 5 GB`)}
    ${hist ? `<div class="cook-h">Last 7 days</div><ul class="uhist">${hist}</ul>` : ""}
    <p class="hint" style="margin:0">Every screen you open, photo you load and timer alert sent is a request. Counts are close estimates kept by the app itself. Over a limit, that feature pauses until the reset; nothing is ever charged. You'll see a warning on the Recipes screen at 70%.</p>`;
}
function usageBanner(){
  const u = S.usage; if (!S.me || !S.me.is_admin || !u) return "";
  const hot = [["server requests", u.pct.requests], ["AI recipe reading", u.pct.neurons], ["storage", u.pct.dbsize]].filter(([, p]) => p >= .7);
  if (!hot.length) return "";
  return `<div class="news warnbox" role="status"><div><b>Getting close to a free limit</b><span>${hot.map(([k, p]) => `${k}: ${Math.round(p * 100)}%`).join(" · ")}</span></div><button class="btn" data-act="usagego">See usage</button></div>`;
}

/* ---------- what's new ---------- */
// Newest first. Every update adds an entry here and bumps APP_VERSION in server.js to match.
const CHANGELOG = [
  { version: "3.2", items: [
    "Lighter on the free plan: the server no longer checks for timer alerts every minute. It wakes only when a cooking timer is running, so a quiet day uses almost nothing",
    "The usage meter now says \"Server requests\" instead of \"App visits\", which is what it really counts"
  ] },
  { version: "3.1", items: [
    "Elements stand out more: cards, lists, chips and buttons lift off a lightly tinted page with soft shadows",
    "Meal plan: each meal is its own colored tile with a picture and cook time, typed notes look different, empty days say \"Nothing planned\", and today is clearly marked",
    "In dark mode, cards and lists are clearly lighter than the background",
    "Bolder section headings with a color marker, and a clear marker on the active tab",
    "Better contrast everywhere: text boxes, buttons, chips and lists have clearer outlines in every color and in light and dark",
    "Grey secondary text is darker and easier to read",
    "Main buttons and favorite stars stand out more",
    "A stronger outline shows where you are when using a keyboard"
  ] },
  { version: "3.0", items: [
    "Separate households: share Recipe Box with friends and family, each with their own private recipes and lists",
    "Name your household on the Me tab",
    "Timer alerts on your lock screen, even when you leave the app (turn on under Me → Timer sound)",
    "Works offline: recipes you've opened stay readable with no signal",
    "Instagram and Facebook links now try harder to read the full caption",
    "Import up to 6 screenshots at once for long captions",
    "Neatly laid-out recipes are sorted without AI, and adding recipes keeps working even when the day's free AI is used up",
    "A clear message, with the reset time, when the day's free AI recipe reading runs out",
    "Feels more like an app: launch screen, no accidental zooming or page bounce, smoother tab changes",
    "A privacy page, linked from the Me tab"
  ] },
  { version: "2.2", items: [
    "On the grocery list, Select is now Edit: fix an item's name right in the list",
    "You can also rename an item from its store tag panel"
  ] },
  { version: "2.1", items: [
    "Grocery items that can be bought anywhere go in a new Any Store group, shown first",
    "Link a grocery item to the exact product: its name shows in blue with a link icon",
    "Add a photo to a grocery item; tap the item to see the photo full screen",
    "Tap an item's store tag to change its store, link or photo"
  ] },
  { version: "2.0", items: [
    "New look: 6 color palettes and 4 font styles to choose from on the Me tab, each with light and dark modes",
    "Recipes show as a photo grid, and recipe pages have a big Start cooking button",
    "Cooking mode: one step at a time in large text, with the ingredients for each step and the screen kept on",
    "Step timers: tap to start, named after what's cooking (like \"Roast · potatoes\"), with 6 alarm sounds that play even on silent",
    "Groceries are sorted by store, with filters for shopping one store at a time",
    "Select several grocery items at once to move them to a store or remove them",
    "Press and hold recipes, ingredients, grocery items and meal plan entries for quick actions",
    "Pick several ingredients on a recipe and send them to the grocery list in one go",
    "Swipe left on the grocery list to see who added each item and when",
    "Forgot password? Someone in the household can make you a reset code",
    "Invite someone to the household with a one-time link you can text them",
    "The Me tab is tidier: each section folds up and opens one at a time",
    "This update history"
  ] },
  { version: "1.0", date: "2026-10-21", items: [
    "First version: save recipes from links, social posts, text and screenshots; shared grocery list; weekly meal plan; serving scaling; Save Recipe shortcut for the Share button"
  ] }
];
function versionDate(v){
  const ms = (S.deployed || {})[v.version] || (v.date ? new Date(v.date + "T12:00").getTime() : 0);
  return ms ? new Date(ms).toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }) : "";
}
const seenVersion = () => { try { return localStorage.getItem("rb-seen-version"); } catch { return null; } };
function markSeen(){ try { localStorage.setItem("rb-seen-version", S.version || CHANGELOG[0].version); } catch {} }
function newsBanner(){
  const cur = S.version || CHANGELOG[0].version;
  let seen = seenVersion();
  if (!seen) {
    if (S.justJoined) { markSeen(); return ""; }       // brand-new account: nothing to announce yet
    seen = "1.0";                                       // phones from before 2.0 never stored a version
  }
  if (seen === cur) return "";
  const entry = CHANGELOG.find(v => v.version === cur);
  return `<div class="news" role="status"><div><b>Recipe Box was updated</b><span>${entry ? entry.items.length + " changes in version " + esc(cur) : "Version " + esc(cur)}</span></div><button class="btn primary" data-act="news">See what's new</button><button class="x" data-act="newsx" aria-label="Dismiss">×</button></div>`;
}
function renderNews(){
  markSeen();
  app.innerHTML = `
    <div class="back-row"><button class="btn ghost" data-act="newsback">← Back</button></div>
    <div class="top"><div><div class="eyebrow">Update history</div><h1>What's new</h1></div></div>
    <div class="news-list">${CHANGELOG.map((v, i) => `<section class="card"><div class="card-body">
      <div class="news-h"><h3>Version ${esc(v.version)}</h3>${i === 0 && v.version === S.version ? `<span class="pill">Current</span>` : ""}</div>
      <div class="small muted">${esc(versionDate(v) ? (i === CHANGELOG.length - 1 ? "Released " : "Went live ") + versionDate(v) : "")}</div>
      <ul class="news-items">${v.items.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
    </div></section>`).join("")}</div>`;
  window.scrollTo(0, 0);
}

/* ---------- look ---------- */
const PALETTES = [
  { id: "tomato", name: "Tomato", sw: ["#e0452b","#ffb81f","#1b1110"] },
  { id: "blueberry", name: "Blueberry", sw: ["#4a43d6","#8fcf2c","#12102a"] },
  { id: "midnight", name: "Midnight", sw: ["#12936a","#f07c43","#111316"] },
  { id: "beet", name: "Beet", sw: ["#c2185b","#ff8a3d","#1c0f16"] },
  { id: "seasalt", name: "Sea Salt", sw: ["#0e8388","#ff6f59","#0d1b1d"] },
  { id: "lemon", name: "Lemon", sw: ["#f2c200","#3c9a5f","#17160f"] }
];
const FONTS = [
  { id: "bold", name: "Bold", display: '"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif', weight: 800, body: '"Figtree", -apple-system, system-ui, sans-serif' },
  { id: "rounded", name: "Rounded", display: '"Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif', weight: 600, body: '"Nunito", -apple-system, system-ui, sans-serif' },
  { id: "classic", name: "Classic", display: '"Gloock", Georgia, serif', weight: 400, body: '"Instrument Sans", -apple-system, system-ui, sans-serif' },
  { id: "easy", name: "Easy Read", display: '"Lexend", -apple-system, system-ui, sans-serif', weight: 700, body: '"Lexend", -apple-system, system-ui, sans-serif' }
];
const currentPalette = () => document.documentElement.getAttribute("data-palette") || "tomato";
const currentFont = () => document.documentElement.getAttribute("data-font") || "bold";
function setFont(id){
  document.documentElement.setAttribute("data-font", id);
  try { localStorage.setItem("rb-font", id); } catch {}
  if (S.tab === "me") renderMe();
}
function syncThemeColor(){ const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#fff4ee"); }
function setPalette(id){
  if (id === "tomato") document.documentElement.removeAttribute("data-palette"); else document.documentElement.setAttribute("data-palette", id);
  try { localStorage.setItem("rb-palette", id); } catch {}
  syncThemeColor(); if (S.tab === "me") renderMe();
}
const currentMode = () => document.documentElement.getAttribute("data-theme") || "auto";
function setMode(m){
  if (m === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", m);
  try { localStorage.setItem("rb-mode", m); } catch {}
  syncThemeColor(); if (S.tab === "me") renderMe();
}
syncThemeColor();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeColor); } catch {}

/* ---------- utils ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lines = s => String(s || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);

async function api(path, opts = {}) {
  const init = { method: opts.method || "GET", headers: {}, credentials: "same-origin" };
  if (opts.body instanceof Blob) { init.body = opts.body; init.headers["content-type"] = opts.body.type || "application/octet-stream"; }
  else if (opts.body !== undefined) { init.body = JSON.stringify(opts.body); init.headers["content-type"] = "application/json"; }
  let res;
  try { res = await fetch(path, init); } catch { throw new Error("No connection. Check your internet and try again."); }
  let data = {}; try { data = await res.json(); } catch {}
  if (res.headers.get("x-offline")) { S.offline = true; if (data && typeof data === "object" && !Array.isArray(data)) data._offline = true; }
  else if (init.method === "GET" && path.startsWith("/api/")) S.offline = false;
  if (res.status === 401 && !path.startsWith("/api/login") && !path.startsWith("/api/signup") && !path.startsWith("/api/reset")) { S.me = null; renderAuth(); throw new Error("Please log in."); }
  if (!res.ok) throw new Error(data.error || "Something went wrong (" + res.status + ").");
  return data;
}

/* ---------- ingredient scaling ---------- */
const UF = {"¼":.25,"½":.5,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125,"⅜":.375,"⅝":.625,"⅞":.875};
const NUM = "(\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:\\.\\d+)?\\s*[¼½¾⅓⅔⅛⅜⅝⅞]|\\d+(?:\\.\\d+)?|[¼½¾⅓⅔⅛⅜⅝⅞])";
const LEAD = new RegExp("^(\\s*)" + NUM + "(?:(\\s*(?:-|–|to)\\s*)" + NUM + ")?");
function pnum(s){
  s = s.trim();
  let m;
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2]/m[3];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1]/m[2];
  if ((m = s.match(/^(\d+(?:\.\d+)?)\s*([¼½¾⅓⅔⅛⅜⅝⅞])$/))) return +m[1] + UF[m[2]];
  if (UF[s] !== undefined) return UF[s];
  return parseFloat(s);
}
function fnum(n){
  if (n >= 20) return String(Math.round(n));
  const whole = Math.floor(n), rem = n - whole;
  const fr = [[0,""],[1/8,"⅛"],[1/4,"¼"],[1/3,"⅓"],[3/8,"⅜"],[1/2,"½"],[5/8,"⅝"],[2/3,"⅔"],[3/4,"¾"],[7/8,"⅞"],[1,""]];
  let best = fr[0], bd = 9; for (const f of fr) { const d = Math.abs(rem - f[0]); if (d < bd) { bd = d; best = f; } }
  if (bd <= 0.04) { const w = best[0] === 1 ? whole + 1 : whole; return (w ? w + (best[1] ? " " : "") : "") + best[1] || "0"; }
  return String(Math.round(n * 10) / 10);
}
function scaleLine(line, f){
  if (f === 1) return esc(line);
  const m = line.match(LEAD);
  if (!m) return esc(line);
  const a = pnum(m[2]); if (!isFinite(a)) return esc(line);
  let out = fnum(a * f);
  if (m[4]) { const b = pnum(m[4]); if (isFinite(b)) out += m[3] + fnum(b * f); }
  return esc(m[1]) + '<span class="scaled">' + esc(out) + "</span>" + esc(line.slice(m[0].length));
}
function scaleText(line, f){ return f === 1 ? line : scaleLine(line, f).replace(/<[^>]+>/g, "").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'"); }
const baseServings = r => { const m = String(r.servings || "").match(/\d+/); return m ? +m[0] : null; };

/* ---------- loading ---------- */
async function boot(){
  try {
    const me = await api("/api/me");
    if (INVITE || START) { INVITE = START = null; try { history.replaceState(null, "", location.pathname); } catch {} }
    S.me = me.user; S.ai = me.ai; S.version = me.version; S.deployed = me.deployed || {}; S.people = Object.fromEntries(me.people.map(p => [p.id, p.name]));
    S.household = me.household; S.usage = me.usage || null; S.ads = me.ads || null; S.vapid = me.vapid || null; S.offline = !!me._offline;
    setupAds(); checkPush();
    await Promise.all([loadRecipes(), loadGrocery()]);
    tabs.hidden = false; render();
  } catch (e) { if (S.me === null) renderAuth(); else { app.innerHTML = `<div class="empty"><h2>Couldn't open the recipe box</h2><p>${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">Try again</button></div>`; } }
}
async function loadRecipes(){ S.recipes = (await api("/api/recipes")).recipes; }
async function loadGrocery(){ const d = await api("/api/grocery"); S.grocery = d.items; S.stores = d.stores || []; }
async function loadPlan(){ S.plan = (await api("/api/plan?from=" + ymd(S.weekStart) + "&to=" + ymd(addDays(S.weekStart, 6)))).entries; }

  if (document.visibilityState !== "visible" || !S.me || S.view === "edit" || S.view === "import") return;

});

/* ---------- render router ---------- */
function render(){
  if (!S.me) return renderAuth();
  for (const b of tabs.querySelectorAll("button")) b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false");
  fab.hidden = !(S.tab === "recipes" && S.view === "list");
  if (S.tab === "plan") return renderPlan();
  if (S.tab === "grocery") return renderGrocery();
  if (S.tab === "me") return renderMe();
  if (S.tab === "news") return renderNews();
  if (S.view === "detail") return renderDetail();
  if (S.view === "edit") return renderEdit();
  if (S.view === "import") return renderImport();
  renderList();
}
function go(tab){
  const run = () => goNow(tab);
  if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches && tab !== S.tab) document.startViewTransition(run); else run();
}
function goNow(tab){ S.tab = tab; S.gSel = null; S.iSel = null; if (tab === "recipes") { S.view = "list"; } window.scrollTo(0,0); if (tab === "plan") { loadPlan().then(render).catch(e => toast(e.message)); } render(); }

/* ---------- recipes list ---------- */
function filtered(){
  const q = S.q.toLowerCase();
  return S.recipes.filter(r => (S.cat === "All" || r.category === S.cat) && (!S.favOnly || r.favorite) &&
    (!q || [r.title, r.ingredients, r.tags, r.source_name].some(x => String(x || "").toLowerCase().includes(q))));
}
function renderList(){
  const list = filtered();
  const used = new Set(S.recipes.map(r => r.category));
  const cats = ["All", ...CATS.filter(c => used.has(c))];
  let body;
  if (!S.recipes.length) body = `<div class="empty"><h2>The box is empty</h2><p>Paste a link from any recipe website, Instagram or Facebook, or add a screenshot. It becomes a card with ingredients, steps and times.</p><button class="btn primary" data-act="new">+ Save the first recipe</button></div>`;
  else if (!list.length) body = `<div class="empty"><h2>No matches</h2><p>Try another word or clear the filters.</p><button class="btn" data-act="clear">Clear filters</button></div>`;
  else body = `<div class="grid">${list.map((r, i) => {
    const total = (+r.prep_min||0) + (+r.cook_min||0);
    const meta = [mins(total), r.category].filter(Boolean).join(" · ");

    const ini = esc((r.title||"?").trim()[0]?.toUpperCase()||"?");

  }).join("")}</div>`;
  app.innerHTML = `
    ${S.offline ? `<div class="offline" role="status">You're offline. Showing the recipes saved on this phone.</div>` : ""}

    ${newsBanner()}

    ${S.recipes.length ? `<input id="q" class="search" type="search" placeholder="Search recipes or ingredients" value="${esc(S.q)}" aria-label="Search recipes">
    <div class="chips" role="toolbar" aria-label="Filter"><button class="chip" data-favonly aria-pressed="${S.favOnly}">★ Favorites</button>${cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${S.cat===c}">${esc(c)}</button>`).join("")}</div>` : ""}
    ${body}`;
  const q = document.getElementById("q");
  if (q) q.addEventListener("input", e => { S.q = e.target.value; const pos = e.target.selectionStart; renderList(); const n = document.getElementById("q"); n.focus(); try { n.setSelectionRange(pos,pos); } catch {} });
}

function gotDraft(recipe, out){
  S.draft = recipe; S.id = null; S.view = "edit"; S.confirmDel = false; S.pendingPhoto = null; S.removePhoto = false;
  S.imp = { url: "", text: "", busy: "", msg: "", err: false, source_url: "" };
  render(); window.scrollTo(0,0);
  toast(out && out.aiLimit ? "Sorted without AI (today's AI is used up). Check it over, then Save." : out && out.method === "sorted" ? "Sorted without AI. Check it over, then Save." : "Check it over, then tap Save");
}
const resetTime = ms => new Date(ms || Date.now()).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
// what to say when the day's free AI is used up and the sorter couldn't help
function limitMsg(out){
  const base = `${out.error} It comes back at ${resetTime(out.resetAt)}.`;
  return out.screenshots
    ? `${base} Reading screenshots needs AI. On iPhone you can copy text straight from a screenshot: open it in Photos, press and hold on the words, tap Select All, then Copy, and paste it in the text box. That's sorted without AI.`
    : `${base} Paste the recipe text in the box below instead. Text with "Ingredients" and "Instructions" headings is sorted without AI.`;
}
async function importUrl(){
  const I = S.imp; const url = I.url.trim();
  if (!/^https?:\/\//i.test(url)) { I.msg = "Paste a full link that starts with https://"; I.err = true; return renderImport(); }
  I.busy = "url"; I.msg = ""; renderImport();
  try {
    const out = await api("/api/import/url", { method: "POST", body: { url } });
    I.busy = "";
    if (out.recipe) return gotDraft(out.recipe, out);
    I.msg = out.aiLimit ? limitMsg(out) : out.error; I.err = true; I.source_url = out.source_url || url;
  } catch (e) { I.busy = ""; I.msg = e.message; I.err = true; }
  renderImport();
}
async function importText(){
  const I = S.imp;
  if (I.text.trim().length < 20) { I.msg = "Paste the caption or recipe text first."; I.err = true; return renderImport(); }
  I.busy = "text"; I.msg = ""; renderImport();
  try {
    const out = await api("/api/import/text", { method: "POST", body: { text: I.text, source_url: I.url.trim() || I.source_url } });
    I.busy = "";
    if (out.recipe) return gotDraft(out.recipe, out);
    I.msg = out.aiLimit ? limitMsg(out) + " Or tap Type it in yourself." : out.error; I.err = true;
  } catch (e) { I.busy = ""; I.msg = e.message; I.err = true; }
  renderImport();
}
async function shrink(file, max, quality){
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(b => res(b), "image/jpeg", quality));
}
// each screenshot is read to text, then the texts are joined in order and turned into one recipe
async function importImages(files){
  const I = S.imp; I.busy = "img"; I.msg = ""; I.err = false;
  const parts = [];
  try {
    for (let i = 0; i < files.length; i++) {
      I.progress = files.length > 1 ? `Reading screenshot ${i + 1} of ${files.length}…` : "Reading the image…"; renderImport();
      let blob; try { blob = await shrink(files[i], 1600, 0.85); } catch { blob = files[i]; }
      const out = await api("/api/import/ocr", { method: "POST", body: blob });
      if (out.aiLimit) { I.busy = ""; I.msg = limitMsg(out); I.err = true; return renderImport(); }
      if (out.error) throw new Error(out.error);
      if (out.text) parts.push(out.text);
    }
    const text = parts.join("\n\n");
    if (text.replace(/\s/g, "").length < 20) throw new Error("Couldn't find any text in those images. Make sure the ingredients are visible.");
    I.progress = "Turning it into a recipe…"; renderImport();
    const out = await api("/api/import/text", { method: "POST", body: { text, source_url: I.url.trim() || I.source_url || "" } });
    I.busy = "";
    if (out.recipe) { if (out.recipe.source_url && !out.recipe.source_name) { try { out.recipe.source_name = new URL(out.recipe.source_url).hostname.replace(/^www\./, ""); } catch {} } return gotDraft(out.recipe, out); }
    I.msg = out.aiLimit ? limitMsg(out) : out.error; I.err = true;
  } catch (e) { I.busy = ""; I.msg = e.message; I.err = true; }
  renderImport();
}

async function save(e){

function whenText(ms){
  if (!ms) return "";
  const d = new Date(+ms), now = new Date();
  const time = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  if (ymd(d) === ymd(now)) return time;
  if (ymd(d) === ymd(addDays(now, -1))) return "Yesterday";
  if (now - d < 6 * 864e5) return d.toLocaleDateString(undefined, { weekday: "short" }) + " " + time;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

(function(){
  const MAX = 118;
  let sx = null, sy = null, on = false, dx = 0;
  const set = v => { app.style.setProperty("--sx", v + "px"); app.style.setProperty("--so", Math.min(1, -v / 60).toFixed(2)); };
  app.addEventListener("pointerdown", e => {
    if (S.tab !== "grocery" || S.gSel || !e.target.closest(".glist.swipe")) return;
    sx = e.clientX; sy = e.clientY; on = false; dx = 0;
  });
  app.addEventListener("pointermove", e => {
    if (sx === null) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!on) { if (Math.abs(mx) > 12 && Math.abs(mx) > Math.abs(my) * 1.3 && mx < 0) { on = true; app.classList.add("swiping"); } else if (Math.abs(my) > 12) { sx = null; return; } else return; }
    dx = Math.max(-MAX, Math.min(0, mx)); set(dx);
  });
  const end = () => { if (sx === null) return; sx = null; if (on) { app.classList.remove("swiping"); set(0); swallowNext = true; setTimeout(() => swallowNext = false, 50); } on = false; };
  let swallowNext = false;
  app.addEventListener("pointerup", end); app.addEventListener("pointercancel", end);
  app.addEventListener("click", e => { if (swallowNext) { swallowNext = false; e.preventDefault(); e.stopPropagation(); } }, true);
})();

const standalone = () => { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch { return false; } };

  if (!pushSupported() || !S.vapid) return `<span class="small muted">${standalone() ? "This phone doesn't support alerts from web apps. On iPhone, update iOS." : "Open Recipe Box from its Home Screen icon (Share → Add to Home Screen in Safari) to turn these on."}</span>`;
  if (Notification.permission === "denied") return `<span class="small muted">Notifications are turned off for Recipe Box. Turn them on in Settings → Notifications → Recipe Box.</span>`;
  if (S.pushOn) return `<span class="small muted">On. Timers will alert you even when your phone is locked or you're in another app.</span><div class="btn-row"><button class="btn" data-act="pushtest">Send a test alert</button></div>`;

}
async function enablePush(){

    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(S.vapid) });
    await api("/api/push/subscribe", { method: "POST", body: sub.toJSON() });

}
function b64uToBytes(s){ const p = "=".repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); }

function longPress(key){

      { label: "Edit recipe", fn: () => { S.tab = "recipes"; S.id = r.id; S.draft = null; S.view = "edit"; S.confirmDel = false; S.pendingPhoto = null; S.removePhoto = false; render(); window.scrollTo(0,0); } },

    ]); return;

    if (S.iSel) return;

  }

      ...(r ? [{ label: "Add ingredients to groceries", fn: () => addIngredientsToGrocery(r) }] : []),

(function(){
  const HOLD = 450;
  let timer = null, startX = 0, startY = 0, target = null, fired = false;
  const cancel = () => { clearTimeout(timer); timer = null; if (target) target.classList.remove("pressing"); target = null; };
  app.addEventListener("pointerdown", e => {
    if (e.button > 0) return;
    const t = e.target.closest("[data-lp]"); if (!t || e.target.closest(".star,.x,.stag,select,input:not(.check)")) return;
    fired = false; target = t; startX = e.clientX; startY = e.clientY;
    t.classList.add("pressing");
    timer = setTimeout(() => { const k = target && target.dataset.lp; const el = target; cancel(); if (!k) return; fired = true; el.classList.add("held"); setTimeout(() => el.classList.remove("held"), 250); longPress(k); }, HOLD);
  });
  app.addEventListener("pointermove", e => { if (timer && (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10)) cancel(); });
  ["pointerup","pointercancel","pointerleave"].forEach(ev => app.addEventListener(ev, () => { if (timer) cancel(); }));
  window.addEventListener("scroll", () => { if (timer) cancel(); }, { passive: true });
  // swallow the tap that ends a long press so it doesn't also open or tick the item;
  // any new touch clears that, in case the screen redrew and no tap followed
  document.addEventListener("pointerdown", () => { if (!timer) fired = false; }, true);
  document.addEventListener("click", e => { if (fired) { fired = false; e.preventDefault(); e.stopPropagation(); } }, true);
  app.addEventListener("contextmenu", e => { if (e.target.closest("[data-lp]")) e.preventDefault(); });
})();
